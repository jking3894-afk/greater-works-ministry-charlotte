<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prayer Request Received | Greater Works Ministry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{background:linear-gradient(135deg,var(--blue-dark),var(--blue));color:white;min-height:100vh;display:grid;place-items:center;padding:1rem}
    .thanks{width:min(720px,100%);background:white;color:var(--text);padding:clamp(2rem,5vw,4rem);border-radius:28px;text-align:center;box-shadow:var(--shadow)}
    .thanks img{width:150px;margin:0 auto 1.5rem}.thanks h1{font-size:clamp(2.6rem,7vw,4.5rem);color:var(--blue-dark)}
    .thanks p{font-size:1.08rem}.thanks .btn{margin-top:1.25rem}
  </style>
</head>
<body>
  <main class="thanks">
    <img src="assets/greater-works-logo.png" alt="Greater Works Ministry of Charlotte logo" />
    <p class="section-kicker">Prayer Request Received</p>
    <h1>Thank You for Trusting Us</h1>
    <p>Your prayer request has been sent to the Greater Works prayer team. We are honored to stand with you in prayer.</p>
    <a class="btn btn-primary" href="index.html">Return to the Website</a>
  </main>
</body>
</html>
